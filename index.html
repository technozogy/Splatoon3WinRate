<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝率管理アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="images/technozogy.png">
        <h1>Splatoon3勝率管理アプリ</h1>
    </div>
    
    <div>
        <label>日付</label>
        <input type="date"/>
    </div>
    <div>
        <label>モード</label>
        <select>
            <option>Xマッチ</option>
            <option>チャレンジ</option>
            <option>オープン</option>
            <option>プラべ</option>
            <option>レギュラー</option>
        </select>
    </div>
    <div>
        <label>ルール</label>
        <select>
            <option>エリア</option>
            <option>ヤグラ</option>
            <option>ホコ</option>
            <option>アサリ</option>
            <option>ナワバリ</option>
        </select>
    </div>
    <div>
        <label>ステージ</label>
            <select>
                <option>ユノハナ大渓谷</option>
                <option>ゴンズイ地区</option>
                <option>ヤガラ市場</option>
                <option>マテガイ放水路</option>
                <option>ナメロウ金属</option>
                <option>マサバ海峡大橋</option>
                <option>キンメダイ美術館</option>
                <option>マヒマヒリゾート＆スパ</option>
                <option>海女美術大学</option>
                <option>チョウザメ造船</option>
                <option>ザトウマーケット</option>
                <option>スメーシーワールド</option>
                <option>クサヤ温泉</option>
                <option>ヒラメが丘団地</option>
                <option>ナンプラー遺跡</option>
                <option>マンタマリア号</option>
                <option>タラポートショッピングパーク</option>
                <option>コンブトラック</option>
                <option>タカアシ経済特区</option>
                <option>オヒョウ海運</option>
                <option>バイガイ亭</option>
                <option>ネギトロ炭鉱</option>
                <option>カジキ空港</option>
                <option>リュウグウターミナル</option>
                <option>デカライン高架下</option>
            </select>
    </div>
    <div>
        <label>使用ブキ</label>
        <select></select>
    </div>
    <div>
        <label>結果</label>
        <input type="radio" name="result">勝ち
        <input type="radio" name="result">負け
    </div>

    <button>登録</button>
</body>
</html>
